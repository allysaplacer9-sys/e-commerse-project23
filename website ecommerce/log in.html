<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="login.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
    }

    /* Main Card */
    .card {
      width: 360px;
      padding: 28px;
      background: #171717;
      border: 5px solid #000;
      border-radius: 20px;
      box-shadow: 12px 12px 0 #000;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translate(-5px, -5px);
      box-shadow: 17px 17px 0 #000;
    }

    /* Title */
    .card__title {
      display: block;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
      color: white;
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .card__title::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 5%;
      width: 90%;
      height: 3px;
      background: white;
      transform: translateX(-110%);
      transition: 0.3s;
    }

    .card:hover .card__title::after {
      transform: translateX(0);
    }

    /* Description */
    .card__content {
      margin-bottom: 25px;
      color: #aaa;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Login Form */
    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Input Fields */
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 25px;
      background: #171717;
      border: 1px solid #333;
      box-shadow: inset 2px 5px 10px #050505;
      transition: 0.3s;
    }

    .field:focus-within {
      border-color: white;
      transform: scale(1.03);
    }

    .input-icon {
      width: 20px;
      height: 20px;
      fill: white;
      flex-shrink: 0;
    }

    .input-field {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
    }

    .input-field::placeholder {
      color: #888;
    }

    /* Buttons */
    .btn {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .button1,
    .button2,
    .button3 {
      border: none;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      color: white;
      background: #252525;
      transition: 0.3s ease;
      font-weight: bold;
    }

    .button1 {
      flex: 1;
      padding: 12px;
    }

    .button2 {
      flex: 1;
      padding: 12px;
    }

    .button1:hover,
    .button2:hover {
      background: white;
      color: black;
    }

    .button3 {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      color: #aaa;
      background: transparent;
    }

    .button3:hover {
      color: white;
      background: #d00000;
    }

    /* Login success/error message */
    .message {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #5ad641;
      color: #000;
    }

    .message.error {
      display: block;
      background: #d00000;
      color: white;
    }

    /* Glitch Animation */
    @keyframes glitch {
      0% {
        transform: translate(0);
      }

      25% {
        transform: translate(2px, -2px);
      }

      50% {
        transform: translate(-2px, 2px);
      }

      75% {
        transform: translate(2px, 2px);
      }

      100% {
        transform: translate(0);
      }
    }

    .glitch {
      animation: glitch 0.2s;
    }

    /* Mobile */
    @media (max-width: 450px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="loginCard">

    <span class="card__title">Log In</span>

    <p class="card__content">
      Welcome back. Enter your credentials to continue.
    </p>

    <form class="form" id="loginForm">

      <!-- Username -->
      <div class="field">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16">
          <path d="M13.106 7.222c0-2.967-2.249-5.032-5.482-5.032
          -3.35 0-5.646 2.318-5.646 5.702 0 3.493 2.235 5.708
          5.762 5.708.862 0 1.689-.123 2.304-.335v-.862
          c-.43.199-1.354.328-2.29.328-2.926 0-4.813-1.88
          -4.813-4.798 0-2.844 1.921-4.881 4.594-4.881
          2.735 0 4.608 1.688 4.608 4.156 0 1.682-.554
          2.769-1.416 2.769-.492 0-.772-.28-.772-.76V5.206
          H8.923v.834h-.11c-.266-.595-.881-.964-1.6-.964
          -1.4 0-2.378 1.162-2.378 2.823 0 1.737.957
          2.906 2.379 2.906.8 0 1.415-.39 1.709-1.087h.11
          c.081.67.703 1.148 1.503 1.148 1.572 0 2.57-1.415
          2.57-3.643z"/>
        </svg>

        <input
          id="username"
          class="input-field"
          type="text"
          placeholder="Username"
          autocomplete="username"
          required>
      </div>

      <!-- Password -->
      <div class="field">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16">
          <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0
          0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0
          0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2
          2 0 0 0-2-2z"/>
        </svg>

        <input
          id="password"
          class="input-field"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required>
      </div>

      <!-- Buttons -->
      <div class="btn">
        <button class="button1" type="submit" >
          Login
        </button>
       
        
      </div>
  <a href="fp.html" class="button3">
    Forgot Password?
</a>

    <p class="p">To sign up <a href="signup.html" class="idk"> click this. </a> </p>
    
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginCard = document.getElementById("loginCard");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      /*
        DEMO LOGIN

        Change these credentials to whatever
        you want for testing.
      */

      const correctUsername = "admin";
      const correctPassword = "1234";

      if (
        username === correctUsername &&
        password === correctPassword
      ) {
        message.textContent = "Login successful!";
        message.className = "message success";
        window.location.href = "web1.html";
         
        // Example redirect:
        // window.location.href = "dashboard.html";

      } else {
        message.textContent = "Incorrect username or password.";
        message.className = "message error";

        loginCard.classList.remove("glitch");

        // Restart glitch animation
        void loginCard.offsetWidth;

        loginCard.classList.add("glitch");
      }
    });

    

    function forgotPassword() {
       window.location.href = "forgot-password.html";

      // Example:
      // window.location.href = "forgot-password.html";
    }
  </script>

</body>
</html>
