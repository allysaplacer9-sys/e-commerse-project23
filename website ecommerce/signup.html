<!DOCTYPE html>
<html lang="en">
      <link rel="stylesheet" href="sign.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
    }

    /* Main Card */
    .card {
      width: 360px;
      padding: 28px;
      background: #171717;
      border: 5px solid #000;
      border-radius: 20px;
      box-shadow: 12px 12px 0 #000;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translate(-5px, -5px);
      box-shadow: 17px 17px 0 #000;
    }

    /* Title */
    .card__title {
      display: block;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
      color: white;
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .card__title::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 5%;
      width: 90%;
      height: 3px;
      background: white;
      transform: translateX(-110%);
      transition: 0.3s;
    }

    .card:hover .card__title::after {
      transform: translateX(0);
    }

    /* Description */
    .card__content {
      margin-bottom: 25px;
      color: #aaa;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Form */
    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Input */
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 25px;
      background: #171717;
      border: 1px solid #333;
      box-shadow: inset 2px 5px 10px #050505;
      transition: 0.3s;
    }

    .field:focus-within {
      border-color: white;
      transform: scale(1.03);
    }

    .input-icon {
      width: 20px; 
      height: 20px;
      fill: white;
      flex-shrink: 0;
    }

    .input-field {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
    }

    .input-field::placeholder {
      color: #888;
    }

    /* Buttons */
    .btn {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .button1,
    .button2,
    .button3 {
      border: none;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s ease;
    }

    /* Sign Up */
    .button1 {
      flex: 1;
      padding: 12px;
      background: #252525;
      color: white;
    }

    .button1:hover {
      background: white;
      color: black;
    }

    /* Login */
    .button2 {
      flex: 1;
      padding: 12px;
      background: #252525;
      color: white;
    }

    .button2:hover {
      background: white;
      color: black;
    }

    /* Forgot Password */
    .button3 {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      background: transparent;
      color: #aaa;
    }

    .button3:hover {
      background: #d00000;
      color: white;
    }

    /* Message */
    .message {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #5ad641;
      color: #000;
    }

    .message.error {
      display: block;
      background: #d00000;
      color: white;
    }

    /* Glitch */
    @keyframes glitch {
      0% {
        transform: translate(0);
      }

      25% {
        transform: translate(2px, -2px);
      }

      50% {
        transform: translate(-2px, 2px);
      }

      75% {
        transform: translate(2px, 2px);
      }

      100% {
        transform: translate(0);
      }
    }

    .glitch {
      animation: glitch 0.2s;
    }

    /* Mobile */
    @media (max-width: 450px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="signupCard">

    <span class="card__title">Sign Up</span>

    <p class="card__content">
      Create your account and get started today.
    </p>

    <form class="form" id="signupForm">

      <!-- Username -->
      <div class="field">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16">

          <path d="M8 8a3 3 0 1 0 0-6
          3 3 0 0 0 0 6z
          M14 14s-1-1-1-4-2-3-5-3-5 1-5 3
          1 4 1 4h10z"/>
        </svg>

        <input
          id="username"
          class="input-field"
          type="text"
          placeholder="Username"
          autocomplete="username"
          required>
      </div>

      <!-- Email -->
      <div class="field">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16">

          <path d="M0 4a2 2 0 0 1 2-2h12
          a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2
          a2 2 0 0 1-2-2V4zm2-.5a.5.5 0 0 0-.3.9
          L8 9.5l6.3-5.1a.5.5 0 0 0-.6-.8L8 8.5
          2.3 3.6A.5.5 0 0 0 2 3.5z"/>
        </svg>

        <input
          id="email"
          class="input-field"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required>
      </div>

      <!-- Password -->
      <div class="field">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16">

          <path d="M8 1a2 2 0 0 1 2 2v4H6V3
          a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4
          a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6
          a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
        </svg>

        <input
          id="password"
          class="input-field"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
          required>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16">

          <path d="M8 1a2 2 0 0 1 2 2v4H6V3
          a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4
          a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6
          a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
        </svg>

        <input
          id="confirmPassword"
          class="input-field"
          type="password"
          placeholder="Confirm Password"
          autocomplete="new-password"
          required>
      </div>

      <!-- Buttons -->
      <div class="btn">

        <button
          class="button1"
          type="submit">
          Sign Up
        </button>

        <button
          class="button2"
          type="button"
          onclick="login()">
          Login
        </button>

      </div>

      <!-- Forgot Password -->
      <button
        class="button3"
        type="button"
        onclick="forgotPassword()">
        Forgot Password?
      </button>

      <div
        id="message"
        class="message">
      </div>

    </form>
  </div>

  <script>


    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const signupCard = document.getElementById("signupCard");

    signupForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      /* Check password */

      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.className =
          "message error";

        glitch();

        return;
      }


      /* Check password length */

      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.className =
          "message error";

        glitch();

        return;
      }


      /* Demo successful registration */

      message.textContent =
        "Account created successfully!";

      message.className =
        "message success";


      console.log("Username:", username);
      console.log("Email:", email);


    });


    /* Go to Login */

    function login() {

      window.location.href = "log in.html";

    }


    /* Forgot Password */

    function forgotPassword() {

      message.textContent =
        "Password recovery selected.";

      message.className =
        "message success";

    }

    /* Glitch Effect */

    function glitch() {

      signupCard.classList.remove("glitch");

      void signupCard.offsetWidth;

      signupCard.classList.add("glitch");

    }
   
  </script>

</body>
</html>
