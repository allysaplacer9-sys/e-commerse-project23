<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="fp.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

    <div class="card">

        <h1 class="card-title">Forgot Password?</h1>

        <p class="card-content">
            Enter your email address and we'll help you reset your password.
        </p>

        <form class="form">

            <!-- Email -->
            <div class="field">

                <svg
                    class="input-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 16 16">

                    <path d="M0 4a2 2 0 0 1 2-2h12
                    a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2
                    a2 2 0 0 1-2-2V4zm2-.5a.5.5 0 0 0-.3.9
                    L8 9.5l6.3-5.1a.5.5 0 0 0-.6-.8L8 8.5
                    2.3 3.6A.5.5 0 0 0 2 3.5z"/>
                </svg>

                <input
                    type="email"
                    class="input-field"
                    placeholder="Enter your email"
                    required>

            </div>

            <!-- Reset Button -->
            <button
                type="submit"
                class="reset-button">
                Reset Password
            </button>

            <!-- Back to Login -->
            <a href="log in.html" class="back-button">
                Back to Login
            </a>

        </form>

    </div>

</body>
</html>
